name: Wipe gh-pages History (One-Shot)

# EINMALIG: Entfernt die komplette gh-pages Git-History und ersetzt sie
# durch einen neuen Orphan-Commit mit den aktuellen Dateien.
# Grund: Firebase API Keys in historischen Commits (Google Security Alert).
# Nach Ausführung kann dieser Workflow gelöscht werden.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "WIPE" to confirm history wipe'
        required: true
        type: string

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'WIPE'

    steps:
      - name: Checkout gh-pages (full history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wipe history and force-push
        run: |
          # Cache all current files
          git rm -r --cached . 2>/dev/null || true

          # Create orphan branch (no history)
          git checkout --orphan gh-pages-clean

          # Re-add all files (they are still in working dir)
          git add .

          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Wipe gh-pages history (security: remove exposed Firebase keys from old commits)"

          # Force-push to gh-pages
          git push origin gh-pages-clean:gh-pages --force

          echo "✅ gh-pages history wiped. All current files preserved, history removed."
