name: Build Android APK

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > Android/app/keystore.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️ No keystore found - building unsigned"
          fi

      - name: Build Release AAB (for Play Store)
        working-directory: ./Android
        env:
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/Android/app/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Build Release APK (for direct distribution)
        working-directory: ./Android
        env:
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/Android/app/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: eisenhauer-v${{ github.run_number }}-playstore-aab
          path: Android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload APK (Direct Distribution)
        uses: actions/upload-artifact@v4
        with:
          name: eisenhauer-v${{ github.run_number }}-direct-apk
          path: Android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Build Info
        run: |
          echo "✅ Android Build erfolgreich!"
          echo "Version: $(cat version.json | grep version | head -1 | cut -d'"' -f4)"
          if [ -f "Android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB Größe: $(ls -lh Android/app/build/outputs/bundle/release/app-release.aab | awk '{print $5}')"
          fi
          if [ -f "Android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK Größe: $(ls -lh Android/app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          fi

      - name: Cleanup Keystore
        if: always()
        run: rm -f Android/app/keystore.jks
