name: Build Android APK

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        working-directory: ./Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eisenhauer-v${{ github.run_number }}-release
          path: Android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Build Info
        run: |
          echo "✅ APK Build erfolgreich!"
          echo "Version: $(cat version.json | grep version | head -1 | cut -d'"' -f4)"
          echo "APK Größe: $(ls -lh Android/app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
