name: Deploy to Staging Environment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: ./.github/actions/setup-node

    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build Staging Version
      run: npm run build:staging

    - name: Deploy to Staging Subdirectory
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        destination_dir: staging
        keep_files: true
        allow_empty_commit: false
        commit_message: '🎨 Staging deployment from ${{ github.sha }}'
        force_orphan: false

    - name: Cleanup sensitive files from gh-pages
      run: |
        echo "🧹 Cleaning up sensitive files from gh-pages branch..."

        # Checkout gh-pages branch
        git fetch origin gh-pages
        git checkout gh-pages

        # List of files/directories to remove
        FILES_TO_REMOVE=(
          ".env"
          ".env.production"
          ".env.staging"
          ".env.testing"
          ".vscode/"
          ".husky/"
          "node_modules/"
          ".templates/"
          "coverage/"
          "Android/"
          ".archive/"
          "build/"
          "builds/"
          ".design-system/"
          "*.log"
        )

        # Remove files if they exist
        REMOVED=0
        for item in "${FILES_TO_REMOVE[@]}"; do
          if [ -e "$item" ] || [ -d "$item" ]; then
            echo "  Removing: $item"
            rm -rf "$item"
            REMOVED=1
          fi
        done

        # Commit and push if changes were made
        if [ $REMOVED -eq 1 ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🧹 Auto-cleanup: Remove sensitive files from gh-pages" || true
          git push origin gh-pages
          echo "✅ Cleanup completed and pushed"
        else
          echo "✅ No cleanup needed - gh-pages is already clean"
        fi

        # Switch back to original branch
        git checkout -

    - name: Comment deployment URL
      run: |
        echo "🎨 Staging deployment successful!"
        echo "Staging URL: https://${{ github.repository_owner }}.github.io/Eisenhauer/staging/"
        echo "Branch: gh-pages (subdirectory: /staging/)"
        echo "🧹 Auto-cleanup: Sensitive files removed from gh-pages"
