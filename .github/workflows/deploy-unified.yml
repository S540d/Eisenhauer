name: Deploy to GitHub Pages (Unified)

on:
  # Deploy only after CI/CD quality checks pass
  workflow_run:
    workflows: ["CI/CD - Automated Quality Checks"]
    types: [completed]
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - production
          - testing

permissions:
  contents: write

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed (or manual trigger)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # For workflow_run: checkout the branch that triggered CI
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Determine environment
        id: env
        run: |
          # Manual trigger with specific environment
          if [ "${{ github.event.inputs.environment }}" != "" ] && [ "${{ github.event.inputs.environment }}" != "auto" ]; then
            ENV="${{ github.event.inputs.environment }}"
          # Auto-detect from branch (workflow_run uses head_branch, fallback to ref)
          else
            BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "refs/heads/main" ]; then
              ENV="production"
            elif [ "$BRANCH" = "testing" ] || [ "$BRANCH" = "refs/heads/testing" ]; then
              ENV="testing"
            else
              echo "Unknown branch: $BRANCH"
              exit 1
            fi
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

          # Set deployment-specific variables
          case $ENV in
            production)
              echo "build_script=build" >> $GITHUB_OUTPUT
              echo "destination_dir=" >> $GITHUB_OUTPUT
              echo "emoji=🚀" >> $GITHUB_OUTPUT
              echo "url=https://s540d.github.io/Eisenhauer/" >> $GITHUB_OUTPUT
              ;;
            testing)
              echo "build_script=build:testing" >> $GITHUB_OUTPUT
              echo "destination_dir=testing" >> $GITHUB_OUTPUT
              echo "emoji=🧪" >> $GITHUB_OUTPUT
              echo "url=https://s540d.github.io/Eisenhauer/testing/" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "Deploying to: $ENV"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build ${{ steps.env.outputs.environment }}
        run: npm run ${{ steps.env.outputs.build_script }}
        # Only production gets the Firebase config. Testing is built without a
        # cloud backend (guest mode, local data only) so it can never reach
        # the live project (#406).
        env:
          VITE_DISABLE_CLOUD: ${{ steps.env.outputs.environment == 'production' && 'false' || 'true' }}
          VITE_FIREBASE_API_KEY: ${{ steps.env.outputs.environment == 'production' && secrets.FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ steps.env.outputs.environment == 'production' && secrets.FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ steps.env.outputs.environment == 'production' && secrets.FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ steps.env.outputs.environment == 'production' && secrets.FIREBASE_STORAGE_BUCKET || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.env.outputs.environment == 'production' && secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ steps.env.outputs.environment == 'production' && secrets.FIREBASE_APP_ID || '' }}

      - name: Guard – keine sensiblen Dateien im Deploy-Verzeichnis
        # Ersetzt den früheren Schritt "Cleanup sensitive files from gh-pages".
        # Der hat gh-pages im Build-Workspace ausgecheckt und per `git add -A`
        # gitignorierte Build-Reste (.expo/, dist/, *-deploy/) erst eingecheckt
        # (S540d/S540d.github.io#28). Geprüft wird jetzt VOR dem Upload genau das,
        # was hochgeladen wird.
        run: |
          DIR=./dist
          BAD=$( { find "$DIR" -maxdepth 1 \( -name node_modules -o -name .expo -o -name .git \) ; \
                  find "$DIR" \( -name '.env' -o -name '.env.*' -o -name '*.jks' -o -name '*.keystore' \
                    -o -name '*.p12' -o -name credentials.json -o -name google-services.json \
                    -o -name GoogleService-Info.plist -o -name local.properties \) ; } | head -20)
          if [ -n "$BAD" ]; then
            echo "::error::Sensible Dateien im Deploy-Verzeichnis $DIR:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ Deploy-Verzeichnis $DIR sauber"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ steps.env.outputs.destination_dir }}
          keep_files: true
          allow_empty_commit: false
          commit_message: '${{ steps.env.outputs.emoji }} ${{ steps.env.outputs.environment }} deployment from ${{ github.sha }}'
          force_orphan: false
          exclude_assets: '.github'

      - name: Deployment Summary
        run: |
          echo "${{ steps.env.outputs.emoji }} ${{ steps.env.outputs.environment }} deployment successful!"
          echo "URL: ${{ steps.env.outputs.url }}"
          echo "Branch: gh-pages${{ steps.env.outputs.destination_dir && format(' (subdirectory: /{0}/)', steps.env.outputs.destination_dir) || ' (root directory)' }}"

          # Add summary to GitHub Actions
          echo "## ${{ steps.env.outputs.emoji }} Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ steps.env.outputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.env.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
