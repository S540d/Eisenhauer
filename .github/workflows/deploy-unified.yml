name: Deploy to GitHub Pages (Unified)

on:
  # Deploy only after CI/CD quality checks pass
  workflow_run:
    workflows: ["CI/CD - Automated Quality Checks"]
    types: [completed]
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - production
          - testing

permissions:
  contents: write

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed (or manual trigger)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # For workflow_run: checkout the branch that triggered CI
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Determine environment
        id: env
        run: |
          # Manual trigger with specific environment
          if [ "${{ github.event.inputs.environment }}" != "" ] && [ "${{ github.event.inputs.environment }}" != "auto" ]; then
            ENV="${{ github.event.inputs.environment }}"
          # Auto-detect from branch (workflow_run uses head_branch, fallback to ref)
          else
            BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "refs/heads/main" ]; then
              ENV="production"
            elif [ "$BRANCH" = "testing" ] || [ "$BRANCH" = "refs/heads/testing" ]; then
              ENV="testing"
            else
              echo "Unknown branch: $BRANCH"
              exit 1
            fi
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

          # Set deployment-specific variables
          case $ENV in
            production)
              echo "build_script=build" >> $GITHUB_OUTPUT
              echo "destination_dir=" >> $GITHUB_OUTPUT
              echo "emoji=🚀" >> $GITHUB_OUTPUT
              echo "url=https://s540d.github.io/Eisenhauer/" >> $GITHUB_OUTPUT
              ;;
            testing)
              echo "build_script=build:testing" >> $GITHUB_OUTPUT
              echo "destination_dir=testing" >> $GITHUB_OUTPUT
              echo "emoji=🧪" >> $GITHUB_OUTPUT
              echo "url=https://s540d.github.io/Eisenhauer/testing/" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "Deploying to: $ENV"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build ${{ steps.env.outputs.environment }}
        run: npm run ${{ steps.env.outputs.build_script }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ steps.env.outputs.destination_dir }}
          keep_files: true
          allow_empty_commit: false
          commit_message: '${{ steps.env.outputs.emoji }} ${{ steps.env.outputs.environment }} deployment from ${{ github.sha }}'
          force_orphan: false
          exclude_assets: '.github'

      - name: Cleanup sensitive files from gh-pages
        run: |
          echo "🧹 Cleaning up sensitive files from gh-pages branch..."

          # Save current working directory state
          git stash --include-untracked || true

          # Checkout gh-pages branch
          git fetch origin gh-pages
          git checkout gh-pages

          # List of files/directories to remove
          FILES_TO_REMOVE=(
            ".env"
            ".env.production"
            ".env.staging"
            ".env.testing"
            ".vscode/"
            ".husky/"
            "node_modules/"
            ".templates/"
            "coverage/"
            "Android/"
            ".archive/"
            "build/"
            "builds/"
            ".design-system/"
            "*.log"
          )

          # Remove files if they exist
          REMOVED=0
          for item in "${FILES_TO_REMOVE[@]}"; do
            if [ -e "$item" ] || [ -d "$item" ]; then
              echo "  Removing: $item"
              rm -rf "$item"
              REMOVED=1
            fi
          done

          # Commit and push if changes were made
          if [ $REMOVED -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "🧹 Auto-cleanup: Remove sensitive files from gh-pages" || true
            git push origin gh-pages
            echo "✅ Cleanup completed and pushed"
          else
            echo "✅ No cleanup needed - gh-pages is already clean"
          fi

          # Switch back to original branch
          git checkout -

      - name: Deployment Summary
        run: |
          echo "${{ steps.env.outputs.emoji }} ${{ steps.env.outputs.environment }} deployment successful!"
          echo "URL: ${{ steps.env.outputs.url }}"
          echo "Branch: gh-pages${{ steps.env.outputs.destination_dir && format(' (subdirectory: /{0}/)', steps.env.outputs.destination_dir) || ' (root directory)' }}"
          echo "🧹 Auto-cleanup: Sensitive files removed from gh-pages"

          # Add summary to GitHub Actions
          echo "## ${{ steps.env.outputs.emoji }} Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ steps.env.outputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.env.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
