name: CI/CD - Automated Quality Checks

on:
  push:
    branches: [main, staging, testing, develop]
  pull_request:
    branches: [main, staging, testing, develop]

# Security: Explicitly set minimal permissions
permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Code Quality & Linting
  # ============================================================================
  code-quality:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Check for console.log in production code
        run: |
          echo "Checking for console.log statements..."
          if grep -r "console\.log\|console\.debug" js/ script.js --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null | grep -v "// debug:"; then
            echo "❌ ERROR: Found console.log/debug in production code!"
            echo "Use '// debug: ' comment to allow specific logs."
            exit 1
          else
            echo "✅ No console.log found (build scripts and index.html excluded)"
          fi

      - name: Check code formatting (Prettier)
        run: npm run format:check || true

      - name: ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --coverage --exclude="tests/unit/storage.test.js"

  # ============================================================================
  # JOB 2: E2E Tests (Project Specific)
  # ============================================================================
  e2e-tests:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e || true

  # ============================================================================
  # JOB 3: Build Verification (Dry Run)
  # ============================================================================
  build-web:
    name: 🌐 Build Verification
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build Web (Dry Run)
        run: npm run build
        env:
          VITE_ENV: production # Test production build by default for verification

      - name: Check dist directory exists
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output found in dist/"
            SIZE=$(du -sh dist | cut -f1)
            echo "📦 Bundle size: $SIZE"
          else
            echo "⚠️ No dist/ directory found"
            exit 1
          fi

  # ============================================================================
  # JOB 4: Version & Compatibility Checks
  # ============================================================================
  version-checks:
    name: 🔧 Version Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check version consistency
        run: |
          echo "Checking version numbers..."

          PACKAGE_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "N/A")
          echo "package.json: $PACKAGE_VERSION"

          # Check if version exists in common places
          if grep -q "version.*=.*['\"]" index.html 2>/dev/null; then
            HTML_VERSION=$(grep -o "version.*=.*['\"][0-9.]*['\"]" index.html | head -1)
            echo "index.html: $HTML_VERSION"
          fi

          if grep -q "version.*=.*['\"]" js/modules/version.js 2>/dev/null; then
            JS_VERSION=$(grep -o "version.*=.*['\"][0-9.]*['\"]" js/modules/version.js | head -1)
            echo "js/modules/version.js: $JS_VERSION"
          fi

          echo "✅ Version check complete"

  # ============================================================================
  # JOB 5: Security Audit
  # ============================================================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for sensitive data
        run: |
          echo "Checking for sensitive data..."
          # Exclude .env files as they might exist in some contexts, but check code
          if grep -ri "api_key\|secret\|password.*=" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude=".env*" 2>/dev/null; then
            echo "⚠️ WARNING: Potential sensitive data found!"
          else
            echo "✅ No obvious sensitive data in code"
          fi

  # ============================================================================
  # JOB 6: Release Readiness Report
  # ============================================================================
  release-checklist:
    name: 📋 Release Readiness
    runs-on: ubuntu-latest
    needs: [code-quality, build-web, version-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Generate Release Report
        run: |
          echo "# 🚀 Release Readiness Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Automated Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Web Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Version Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Manual Checks Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Test in Chrome" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Test in Safari" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Test on mobile browsers" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Lighthouse audit passed" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] PWA installable (if applicable)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $(node -p "require('./package.json').version" 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
