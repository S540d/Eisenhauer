# Dependabot – kostenlose Dependency-Updates + Security-Alerts.
# Ersetzt zusammen mit codeql.yml den kostenpflichtigen Anthropic-API-Scan.

version: 2
updates:
  # GitHub-Actions-Versionen (gilt für ALLE Repos, auch ohne package.json).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # Kein update-types-Filter → Major landet mit im Sammel-PR.
      actions-all:
        patterns:
          - "*"

  # NPM/Yarn/PNPM-Abhängigkeiten.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    # Majors bewusst blockiert (siehe CLAUDE.md, "Blockierte Major-Dependency-Bumps"):
    # TS7 (typescript-eslint-Peer), Vite 8 (manualChunks/Rolldown), Vitest 5 (Node >= 22).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Kein update-types-Filter → Major landet mit im Sammel-PR.
      npm-all:
        patterns:
          - "*"
